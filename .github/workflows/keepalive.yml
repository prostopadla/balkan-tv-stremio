name: Keep schedule alive

# GitHub turns scheduled workflows off after 60 days without commits in the repo.
# Once a month this switches them back on through the API, so no dummy commits are needed.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in refresh.yml epg.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "$wf: enabled"
          done
